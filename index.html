<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sport Dashboard</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sport">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0f14; --bg2:#13161d; --bg3:#1a1e28; --bg4:#222636;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8eaf0; --muted:#7a7f96;
  --acc:#c8f53a; --acc2:#3ab4f5; --acc3:#f5a03a; --acc4:#f53a6e; --acc5:#3af5a0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ---- NOISE OVERLAY ---- */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");opacity:.4;pointer-events:none;z-index:0;}

/* ---- HEADER ---- */
.hdr{position:relative;z-index:10;padding:32px 32px 0;display:flex;align-items:center;justify-content:space-between;}
.hdr-brand{display:flex;align-items:center;gap:14px;}
.brand-icon{width:48px;height:48px;background:var(--acc);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-icon img{width:40px;height:40px;object-fit:contain;border-radius:7px;}
.brand-text h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;line-height:1;}
.brand-text h1 span{color:var(--acc);}
.brand-text p{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;letter-spacing:.5px;}
.hdr-time{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);text-align:right;}
#clock{font-size:22px;color:var(--text);font-family:'Bebas Neue',sans-serif;letter-spacing:2px;display:block;}

/* ---- HERO ---- */
.hero{position:relative;z-index:10;padding:40px 32px 0;}
.hero-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,8vw,96px);letter-spacing:4px;line-height:.95;color:var(--text);}
.hero-title em{color:var(--acc);font-style:normal;}
.hero-sub{font-size:14px;color:var(--muted);margin-top:14px;max-width:480px;line-height:1.6;}

/* ---- DIVIDER ---- */
.divider{position:relative;z-index:10;margin:40px 32px 0;height:1px;background:linear-gradient(90deg,var(--acc) 0%,rgba(200,245,58,.1) 60%,transparent 100%);}
.divider-label{position:absolute;top:-10px;left:0;font-family:'DM Mono',monospace;font-size:10px;color:var(--acc);letter-spacing:.2em;background:var(--bg);padding-right:10px;}

/* ---- SPORT GRID ---- */
.sport-section{position:relative;z-index:10;padding:28px 32px 0;}
.sport-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px;}

.sport-card{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;text-decoration:none;display:block;}
.sport-card:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:0 12px 40px rgba(0,0,0,.4);}
.sport-card.active{border-color:rgba(200,245,58,.35);}
.sport-card.active:hover{box-shadow:0 12px 40px rgba(200,245,58,.08);}
.sport-card.soon{opacity:.55;cursor:default;}
.sport-card.soon:hover{transform:none;box-shadow:none;}

.card-inner{padding:20px;}
.card-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px;background:var(--bg3);}
.card-icon img{width:38px;height:38px;object-fit:contain;border-radius:7px;}
.card-sport{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--text);line-height:1;}
.card-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
.card-badge{position:absolute;top:12px;right:12px;font-size:10px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:4px;}
.badge-active{background:rgba(200,245,58,.15);color:var(--acc);border:1px solid rgba(200,245,58,.3);}
.badge-soon{background:rgba(122,127,150,.1);color:var(--muted);border:1px solid rgba(122,127,150,.2);}
.badge-next{background:rgba(58,180,245,.12);color:var(--acc2);border:1px solid rgba(58,180,245,.25);}
.card-arrow{position:absolute;bottom:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;transition:background .15s;}
.sport-card.active:hover .card-arrow{background:var(--acc);}
.sport-card.active:hover .card-arrow svg{color:#0d0f14;}
.card-accent{position:absolute;bottom:0;left:0;right:0;height:2px;}

/* ---- LATEST RESULTS ---- */
.results-section{position:relative;z-index:10;padding:36px 32px 0;}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);}
.live-badge{font-size:10px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:4px;background:rgba(245,58,110,.15);color:var(--acc4);border:1px solid rgba(245,58,110,.3);}
.ldot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc4);animation:pulse 1.2s ease-in-out infinite;margin-right:4px;vertical-align:middle;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:700px){.results-grid{grid-template-columns:1fr;}.sport-grid{grid-template-columns:1fr 1fr;}}

.result-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.result-card-hdr{padding:9px 14px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.rc-sport{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);}
.rc-comp{font-size:11px;color:var(--muted);}
.rc-date{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}
.result-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);gap:6px;}
.result-row:last-child{border-bottom:none;}
.rh{text-align:right;}
.ra{text-align:left;}
.rn{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rn.w{color:var(--acc5);font-weight:600;}
.rs{text-align:center;min-width:72px;}
.rsm{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;line-height:1;}
.rss{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);margin-top:1px;}

/* ---- UPCOMING ---- */
.upcoming-section{position:relative;z-index:10;padding:32px 32px 0;}
.upcoming-list{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.upcoming-row{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--border);transition:background .1s;}
.upcoming-row:last-child{border-bottom:none;}
.upcoming-row:hover{background:var(--bg3);}
.up-date{text-align:center;background:var(--bg4);border-radius:6px;padding:5px 8px;min-width:44px;}
.up-day{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text);line-height:1;}
.up-mon{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;}
.up-sport-badge{font-size:10px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:4px;flex-shrink:0;}
.up-match{flex:1;font-size:13px;font-weight:500;}
.up-comp{font-size:11px;color:var(--muted);margin-top:2px;}

/* ---- FOOTER ---- */
.footer{position:relative;z-index:10;padding:24px 32px 32px;margin-top:40px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.footer-l{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.footer-r{display:flex;gap:8px;}
.footer-dot{width:8px;height:8px;border-radius:50%;background:var(--bg4);}
.footer-dot.active{background:var(--acc);}
.footer-dot.next{background:var(--acc2);}

/* ---- FLAG ---- */
.flag-img{width:18px;height:13px;object-fit:cover;border-radius:2px;vertical-align:middle;margin-right:3px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <div class="brand-icon">
      <img src="icon.png" alt="Sport Dashboard" id="brandIcon">
    </div>
    <div class="brand-text">
      <h1>SPORT <span>DASHBOARD</span></h1>
      <p>PERSÖNLICHES SPORT-INFORMATIONSSYSTEM</p>
    </div>
  </div>
  <div class="hdr-time">
    <span id="clock">00:00:00</span>
    <span id="dateStr">–</span>
  </div>
</div>

<div class="divider" style="margin-top:28px;"><span class="divider-label">DASHBOARDS</span></div>

<div class="sport-section">
  <div class="sport-grid" id="sportGrid"></div>
</div>

<div class="divider" style="margin-top:40px;"><span class="divider-label">LATEST RESULTS</span></div>

<div class="results-section">
  <div class="section-hdr">
    <div class="section-title"><span class="dot"></span> Neueste Ergebnisse</div>
    <div class="rc-date" id="resultsDate">–</div>
  </div>
  <div class="results-grid" id="resultsGrid"></div>
</div>

<div class="divider" style="margin-top:36px;"><span class="divider-label">NÄCHSTE EVENTS</span></div>

<div class="upcoming-section">
  <div class="section-hdr">
    <div class="section-title"><span class="dot" style="background:var(--acc3)"></span> Anstehende Spiele</div>
  </div>
  <div class="upcoming-list" id="upcomingList"></div>
</div>

<div class="footer">
  <div class="footer-l">Sport Dashboard · <span id="footerTime">–</span> · Alle Daten lokal geladen</div>
  <div class="footer-r">
    <div class="footer-dot active" title="Rugby – aktiv"></div>
    <div class="footer-dot next" title="Cricket – coming soon"></div>
    <div class="footer-dot" title="Weitere folgen"></div>
  </div>
</div>

<script>
// =================== CLOCK ===================
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('dateStr').textContent = now.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  document.getElementById('footerTime').textContent = now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
tick(); setInterval(tick, 1000);

// =================== SPORT CARDS ===================
const SPORTS = [
  {
    id:'rugby', label:'Rugby', desc:'Union · Sevens · P1/P2/P3 Wettbewerbe',
    status:'active', badge:'AKTIV', url:'rugby.html#testRugby',
    accent:'#c8f53a', icon:'rugby_icon',
    comp:'URC · Six Nations · NC2026 · SVNS',
  },
  {
    id:'cricket', label:'Cricket', desc:'Test · ODI · T20I · IPL · The Hundred',
    status:'active', badge:'AKTIV', url:'cricket.html#testOverview',
    accent:'#3ab4f5', icon:'🏏',
    comp:'Test · WTC · Eng Summer 2026 · IPL',
  },
  {
    id:'tennis', label:'Tennis', desc:'Grand Slams · ATP · WTA Tour',
    status:'soon', badge:'BALD', url:'#',
    accent:'#f5a03a', icon:'🎾',
    comp:'Geplant',
  },
  {
    id:'f1', label:'Formel 1', desc:'FIA Formula One World Championship',
    status:'soon', badge:'BALD', url:'#',
    accent:'#f53a6e', icon:'🏎',
    comp:'Geplant',
  },
  {
    id:'indycar', label:'IndyCar', desc:'NTT IndyCar Series',
    status:'soon', badge:'BALD', url:'#',
    accent:'#ff6b35', icon:'🏁',
    comp:'Geplant',
  },
  {
    id:'cycling', label:'Radsport', desc:'Tour de France · Giro · Vuelta',
    status:'soon', badge:'BALD', url:'#',
    accent:'#3af5a0', icon:'🚴',
    comp:'Geplant',
  },
  {
    id:'sumo', label:'Sumo', desc:'Honbasho · Grand Sumo Tournaments',
    status:'soon', badge:'BALD', url:'#',
    accent:'#f5e03a', icon:'🎌',
    comp:'Geplant',
  },
  {
    id:'chess', label:'Schach', desc:'FIDE · World Championship · Candidates',
    status:'soon', badge:'BALD', url:'#',
    accent:'#a03af5', icon:'♟',
    comp:'Geplant',
  },
  {
    id:'football', label:'Fußball', desc:'Champions League · Bundesliga · mehr',
    status:'soon', badge:'BALD', url:'#',
    accent:'#3ab4f5', icon:'⚽',
    comp:'Geplant',
  },
];

const LS_PREFIX = 'rugby_logo_';
function getLogo(key) {
  try { return localStorage.getItem(LS_PREFIX + key) || null; } catch(e) { return null; }
}

function renderSportCards() {
  const grid = document.getElementById('sportGrid');
  grid.innerHTML = SPORTS.map(s => {
    const isActive = s.status === 'active';
    const isNext = s.status === 'next';
    // Rugby: use icon.png (always available in repo), localStorage logos as enhancement
    let iconHtml;
    if (s.id === 'rugby') {
      const storedLogo = getLogo('testRugby');
      iconHtml = storedLogo
        ? `<img src="${storedLogo}" alt="Rugby" style="width:38px;height:38px;object-fit:contain;border-radius:7px;">`
        : `<span style="font-size:26px;">🏉</span>`;
    } else if (s.id === 'cricket') {
      const storedLogo = getLogo('cricket');
      iconHtml = storedLogo
        ? `<img src="${storedLogo}" alt="Cricket" style="width:38px;height:38px;object-fit:contain;border-radius:7px;">`
        : `<span style="font-size:26px;">🏏</span>`;
    } else {
      iconHtml = `<span style="font-size:26px;">${s.icon}</span>`;
    }
    return `<a class="sport-card ${isActive?'active':''} ${s.status==='soon'?'soon':''}"
      href="${isActive?s.url:'#'}"
      onclick="${isActive?'':'return false'}">
      <div class="card-inner">
        <div class="card-icon">${iconHtml}</div>
        <div class="card-sport">${s.label}</div>
        <div class="card-desc">${s.comp}</div>
      </div>
      <span class="card-badge ${isActive?'badge-active':isNext?'badge-next':'badge-soon'}">${s.badge}</span>
      ${isActive ? `<div class="card-arrow">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>` : ''}
      <div class="card-accent" style="background:${s.accent};opacity:${isActive?'.6':'.2'}"></div>
    </a>`;
  }).join('');
}

// =================== LATEST RESULTS ===================
const LATEST = [
  {sport:'RUGBY', comp:'Champions Cup · Finale', date:'23. Mai 2026',
   matches:[{home:'Bordeaux-Bègles',away:'Leinster',sh:'41',sa:'19',w:'home'}]},
  {sport:'RUGBY', comp:'Challenge Cup · Finale', date:'23. Mai 2026',
   matches:[{home:'Montpellier',away:'Ulster',sh:'59',sa:'26',w:'home'}]},
  {sport:'CRICKET', comp:'T20 World Cup · Finale', date:'7. Mär 2026',
   matches:[{home:'🇮🇳 Indien',away:'🇿🇦 Südafrika',sh:'176/6',sa:'170/8',w:'home'}]},
  {sport:'CRICKET', comp:'IPL 2026 · Finale', date:'1. Jun 2026',
   matches:[{home:'Mumbai Indians',away:'Chennai Super Kings',sh:'183/5',sa:'177/8',w:'home'}]},
];

function renderResults() {
  const grid = document.getElementById('resultsGrid');
  const now = new Date();
  document.getElementById('resultsDate').textContent =
    now.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});

  grid.innerHTML = LATEST.map(block => `
    <div class="result-card">
      <div class="result-card-hdr">
        <span class="rc-sport">${block.sport}</span>
        <span class="rc-comp">${block.comp}</span>
        <span class="rc-date">${block.date}</span>
      </div>
      ${block.matches.map(m => `
        <div class="result-row">
          <div class="rh"><div class="rn ${m.w==='home'?'w':''}">${m.home}</div></div>
          <div class="rs">
            <div class="rsm">${m.sh} – ${m.sa}</div>
            <div class="rss">Abpfiff</div>
          </div>
          <div class="ra"><div class="rn ${m.w==='away'?'w':''}">${m.away}</div></div>
        </div>`).join('')}
    </div>`).join('');
}

// =================== UPCOMING ===================
const UPCOMING = [
  {date:'2026-06-04',sport:'CRICKET',sportColor:'var(--acc2)',match:'England vs Neuseeland · 1. Test',comp:'Crowe-Thorpe Trophy · Lord\'s 🔴 LIVE'},
  {date:'2026-06-06',sport:'RUGBY',sportColor:'var(--acc)',match:'URC Playoffs · QF',comp:'United Rugby Championship'},
  {date:'2026-06-17',sport:'CRICKET',sportColor:'var(--acc2)',match:'England vs Neuseeland · 2. Test',comp:'Crowe-Thorpe Trophy · The Oval'},
  {date:'2026-06-20',sport:'RUGBY',sportColor:'var(--acc)',match:'Premiership Finale',comp:'Gallagher Premiership · Twickenham'},
  {date:'2026-06-25',sport:'CRICKET',sportColor:'var(--acc2)',match:'England vs Neuseeland · 3. Test',comp:'Crowe-Thorpe Trophy · Trent Bridge'},
  {date:'2026-06-27',sport:'RUGBY',sportColor:'var(--acc)',match:'Top 14 Finale',comp:'Top 14 · Stade de France'},
  {date:'2026-07-02',sport:'CRICKET',sportColor:'var(--acc2)',match:'England vs Indien · 1. Test',comp:'England Home Summer · Lord\'s'},
  {date:'2026-07-04',sport:'RUGBY',sportColor:'var(--acc)',match:'Nations Championship · Runde 1',comp:'NC2026 · Southern Series Start'},
  {date:'2026-07-24',sport:'CRICKET',sportColor:'var(--acc2)',match:'The Hundred 2026 · Start',comp:'The Hundred · The Oval'},
];

function renderUpcoming() {
  const list = document.getElementById('upcomingList');
  list.innerHTML = UPCOMING.map(u => {
    const dt = new Date(u.date);
    return `<div class="upcoming-row">
      <div class="up-date">
        <div class="up-day">${dt.getDate()}</div>
        <div class="up-mon">${dt.toLocaleDateString('de-DE',{month:'short'}).toUpperCase()}</div>
      </div>
      <span class="up-sport-badge" style="background:${u.sportColor}22;color:${u.sportColor};border:1px solid ${u.sportColor}44;">${u.sport}</span>
      <div>
        <div class="up-match">${u.match}</div>
        <div class="up-comp">${u.comp}</div>
      </div>
    </div>`;
  }).join('');
}

// =================== INIT ===================
document.addEventListener('DOMContentLoaded', () => {
  renderSportCards();
  renderResults();
  renderUpcoming();
});
</script>
</body>
</html>
